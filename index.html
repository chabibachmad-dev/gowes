<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gowes — Analisis Ride</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
</head>
<body>
  <header class="appbar">
    <button class="icon-btn back" id="btnBack" hidden aria-label="Kembali">‹</button>
    <h1 id="title">Gowes</h1>
    <span class="sync-status" id="syncStatus"></span>
    <button class="icon-btn" id="btnSync" aria-label="Sinkron dari Garmin" title="Sinkron dari Garmin">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden></div>
  <main id="view" class="view"></main>

  <nav class="tabbar">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Beranda</span></a>
    <a href="#/rides" data-tab="rides"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l2 8h-6"/></svg><span>Ride</span></a>
    <a href="#/garage" data-tab="garage"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg><span>Garasi</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 14H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.6V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg><span>Setelan</span></a>
  </nav>

  <section class="login" id="login" hidden>
    <div class="login-card">
      <div class="logo">
        <svg viewBox="0 0 64 64" width="56" height="56"><circle cx="16" cy="42" r="11" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="48" cy="42" r="11" fill="none" stroke="currentColor" stroke-width="4"/><path d="M16 42l10-20h13l9 20M26 22l6 20H16M36 14h6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Gowes</h2>
      <p class="muted">Masukkan kode akses untuk membuka data ride Anda.</p>
      <form id="loginForm">
        <input type="password" id="pinInput" placeholder="Kode akses" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Masuk</button>
        <p class="error" id="loginErr"></p>
      </form>
    </div>
  </section>

  <button class="fab" id="fabJarwo" hidden aria-label="Tanya Jarwo"><span>J</span></button>
  <section class="chat" id="chat" hidden>
    <div class="chat-panel">
      <header class="chat-head">
        <div class="avatar">J</div>
        <div class="ttl"><b>Jarwo</b><span id="chatCtx"></span></div>
        <button class="icon-btn sm" id="chatClear" aria-label="Hapus riwayat" title="Hapus riwayat">🗑</button>
        <button class="icon-btn sm" id="chatClose" aria-label="Tutup">✕</button>
      </header>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="chat-sugg" id="chatSugg"></div>
      <form class="chat-form" id="chatForm">
        <textarea id="chatIn" rows="1" placeholder="Tanya Jarwo soal gowesmu…"></textarea>
        <button class="btn primary" type="submit" aria-label="Kirim">➤</button>
      </form>
    </div>
  </section>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
